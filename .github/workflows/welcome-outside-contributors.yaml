name: Welcome Outside Contributors

on:
      issues:
            types:
                  - opened
      pull_request_target:
            types:
                  - opened
      issue_comment:
            types:
                  - created

permissions:
      contents: read
      issues: write
      pull-requests: write

jobs:
      welcome:
            runs-on: ubuntu-latest
            steps:
                  - name: Welcome first-time outside contributors
                    uses: actions/github-script@v7
                    with:
                          github-token: ${{ secrets.OPENGOVMAIL_BOT_TOKEN || github.token }}
                          script: |
                                const payload = context.payload;
                                // Greet whoever triggered us: the opener of an issue/PR, or a commenter.
                                const subject = payload.comment || payload.pull_request || payload.issue;
                                const issueNumber = (payload.issue || payload.pull_request).number;
                                const user = subject.user;
                                const login = user.login;

                                // CLAassistant and friends post as plain User accounts, so the
                                // account type alone is not enough to spot a service account.
                                const SERVICE_ACCOUNTS = new Set([
                                  "claassistant",
                                  "codecov",
                                  "dependabot",
                                  "github-actions",
                                  "greptile-apps",
                                  "opengovmailbot",
                                  "renovate",
                                  "sonarcloud",
                                ]);
                                const normalized = login.toLowerCase().replace(/\[bot\]$/, "");

                                if (user.type === "Bot" || login.endsWith("[bot]") || SERVICE_ACCOUNTS.has(normalized)) {
                                  core.info(`Skipping welcome for service account ${login}.`);
                                  return;
                                }

                                const OUTSIDE = ["NONE", "FIRST_TIMER", "FIRST_TIME_CONTRIBUTOR", "CONTRIBUTOR"];
                                if (!OUTSIDE.includes(subject.author_association)) {
                                  core.info(`Skipping welcome for ${login} (${subject.author_association}).`);
                                  return;
                                }

                                const owner = context.repo.owner;
                                const repo = context.repo.repo;
                                const defaultBranch = payload.repository.default_branch;
                                const repoUrl = `https://github.com/${owner}/${repo}`;
                                const marker = `<!-- outside-contributor-welcome:${login.toLowerCase()} -->`;

                                const comments = await github.paginate(
                                  github.rest.issues.listComments,
                                  {
                                    owner,
                                    repo,
                                    issue_number: issueNumber,
                                    per_page: 100,
                                  },
                                );

                                const alreadyWelcomed = comments.some((comment) =>
                                  typeof comment.body === "string" && comment.body.includes(marker),
                                );

                                if (alreadyWelcomed) {
                                  core.info(`Skipping duplicate welcome for ${login} on issue #${issueNumber}.`);
                                  return;
                                }

                                const body = [
                                  `Hi @${login}, thanks for joining the conversation. Our maintainers will be here soon to help you get started.`,
                                  ``,
                                  `Useful links, if you're new to the project:`,
                                  `- [Contributing guide](${repoUrl}/blob/${defaultBranch}/docs/CONTRIBUTING.md)`,
                                  `- [Code of conduct](${repoUrl}/blob/${defaultBranch}/docs/CODE_OF_CONDUCT.md)`,
                                  ``,
                                  `Glad to have you here.`,
                                  marker,
                                ].join("\n");

                                await github.rest.issues.createComment({
                                  owner,
                                  repo,
                                  issue_number: issueNumber,
                                  body,
                                });
