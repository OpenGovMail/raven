# Raven IMAP Server Configuration Example

domain: "example.com"
auth_server_url: "http://auth-service:8080"

# Mail domains of each organization unit, keyed by OU ID.
# - An OU can own several domains; a domain can belong to only one OU.
# - List the main domain first: group mail addresses the OU's users at it.
# - An OU that isn't listed owns no mail domain.
# - Domains are matched case-insensitively and a trailing dot is ignored.
# Read at startup by every service; an invalid mapping stops them from starting.
organization_unit_domains:
  "00000000-0000-0000-0000-000000000001":
    - "example.com"
    - "example.org"

# OAUTHBEARER Token Validation (RFC 7628)
# Required when enabling AUTH=OAUTHBEARER for IMAP/SASL.
oauth_issuer_url: "https://idp.example.com"
oauth_jwks_url: "https://idp.example.com/.well-known/jwks.json"
oauth_audience:
  - "raven-imap"
oauth_clock_skew_seconds: 60
# Optional JSON mapping for client_credentials sender authorization:
# {
#   "client_id_1": ["email1@example.com", "email2@example.com"],
#   "client_id_2": ["email3@example.com"]
# }
oauth_client_email_authorization_file: "./config/oauth_client_email_authorization.json"

# SASL Authentication Scope
# Controls where SASL authentication is enforced
# Options: "tcp_only", "unix_socket_only", "all" (default)
# - tcp_only: Apply SASL only on TCP connections (secure external access, trust local)
# - unix_socket_only: Apply SASL only on Unix domain sockets (secure local IPC)
# - all: Apply SASL to all connection types (maximum security)
sasl_scope: "all"

# S3-Compatible Blob Storage Configuration
blob_storage:
  enabled: true
  endpoint: "http://localhost:8333" # SeaweedFS endpoint
  region: "us-east-1"
  bucket: "email-attachments"
  access_key: "your-access-key"
  secret_key: "your-secret-key"
  timeout: 30 # seconds
